# Required
version: 2

build:
  os: "ubuntu-24.04"
  tools:
    python: "3.13"
  jobs:
    post_install:
      # docs requirements are a PEP 735 dependency group, not an extra
      - python -m pip install --upgrade "pip>=25.1"
      - python -m pip install --group docs

python:
  install:
    - method: pip
      path: .
