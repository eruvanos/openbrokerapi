name: Python publish package
on:
  push:
    tags:
      - "v*.*.*"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-testpypi:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      # IMPORTANT: this permission is mandatory for trusted publishing
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: 'latest'
          python-version: '3.11'  # use the oldest supported Python version for publishing
          enable-cache: true

      - name: Build Package
        run: |
          uv build

      - name: Upload dist artefact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: dist
          path: dist/*

      - name: Publish package distributions to Test-PyPI
        run: |
          uv publish --trusted-publishing always --publish-url https://test.pypi.org/legacy/

  publish-pypi:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      # IMPORTANT: this permission is mandatory for trusted publishing
      id-token: write
    needs: build-and-testpypi

    steps:
      - name: Download dist artefact
        uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: 'latest'

      - name: Publish package distributions to PyPI
        run: |
          uv publish --trusted-publishing always
